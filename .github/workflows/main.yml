# Workflow that runs on every push to main (i.e. every merge into main).
# Full pipeline: unit tests -> build image -> integration tests -> tag -> push.
name: Main pipeline

on:
  push:
    branches: [main]

# Permissions this workflow needs. "packages: write" lets us push to GHCR.
permissions:
  contents: read
  packages: write

# Variables we reuse throughout the workflow.
env:
  # GHCR image name follows: ghcr.io/<owner>/<repo-name>
  # github.repository is automatically set to "owner/repo" by GitHub.
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------- Job 1: unit tests ----------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest app/ -v

  # ---------- Job 2: build, integration test, and push the Docker image ----------
  build-and-push:
    # Only run this job if unit-tests passed.
    needs: unit-tests
    runs-on: ubuntu-latest

    # Service containers: GitHub spins these up next to the job for us.
    # Here we get a MySQL 8 ready to use, then tear it down when the job ends.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: fruitdb
          MYSQL_USER: fruituser
          MYSQL_PASSWORD: fruitpass
        ports:
          - 3306:3306
        # GitHub will mark the service "healthy" only when MySQL answers ping.
        # Our later steps wait on this so we don't race the database.
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Build the image locally on the runner. We tag it with the git SHA
      # for uniqueness, and also "latest" so it's easy to reference.
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      # MySQL service is started by GitHub before steps run, but it may still
      # be initializing the user/database. This extra wait makes startup
      # deterministic and avoids flaky integration tests.
      - name: Wait for MySQL to accept connections
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u fruituser -pfruitpass --silent; then
              echo "MySQL is ready"
              exit 0
            fi
            echo "waiting for MySQL... ($i)"
            sleep 2
          done
          echo "MySQL never became ready"
          exit 1

      # Start the FruitAPI container in the background.
      # --network host lets the container reach the MySQL service at localhost:3306
      # (the same way the runner itself reaches it).
      # We pass DB env vars so the app knows where to connect.
      - name: Start container
        run: |
          docker run -d \
            --name fruitapi \
            --network host \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_USER=fruituser \
            -e DB_PASSWORD=fruitpass \
            -e DB_NAME=fruitdb \
            $IMAGE_NAME:${{ github.sha }}

      # Wait until the app responds to /health, with a timeout.
      # Without this, integration tests could fire before uvicorn has started.
      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health; then
              echo " - app is up"
              exit 0
            fi
            echo "waiting for app... ($i)"
            sleep 1
          done
          echo "app never started"
          docker logs fruitapi || true
          exit 1

      # Install just enough Python to run pytest against the running container.
      - name: Set up Python for integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests against the container
        env:
          BASE_URL: http://localhost:8000
        run: pytest tests/ -v

      # Show app logs if anything failed — helps debug CI runs.
      - name: Show app logs on failure
        if: failure()
        run: docker logs fruitapi || true

      # Stop and remove the container — we're done with it.
      - name: Stop container
        if: always()
        run: docker rm -f fruitapi || true

      # Log in to GHCR using the auto-provided token. No manual secret needed.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push both the SHA-tagged image and "latest".
      - name: Push image to GHCR
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
        
        # ---------- Job 3: deploy to AWS ECS ----------
  # This job runs after the Docker image has been built and pushed to GHCR.
  # It tells ECS to restart the service so it can pull the newest :latest image.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Set up AWS credentials on the GitHub Actions runner.
      # The actual values are stored in GitHub repo secrets, not in the code.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # Ask ECS to start a new deployment.
      # This makes the service replace the old running tasks with new ones
      # that use the latest image from GHCR.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster fruitapi-cluster \
            --service fruitapi-service \
            --force-new-deployment \
            --region eu-north-1

      # Wait until ECS says the service is stable again.
      # That means the new tasks are running properly and the old ones are gone.
      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster fruitapi-cluster \
            --services fruitapi-service \
            --region eu-north-1
